<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inventory Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
      background: #f4f6f8;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 17px;
      margin-top: 15px;
      cursor: pointer;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    .box {
      margin-top: 20px;
      padding: 15px;
      background: #eeeeee;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>

</head>

<body>

<div class="container">

  <h1>Inventory Scanner</h1>

  <p>Mobile Barcode Scanner</p>


  <!-- API TEST BUTTON -->

  <button onclick="testAPI()">
    🧪 TEST API CONNECTION
  </button>

  <div id="apiResult" class="box">
    API not tested
  </div>


  <!-- BARCODE SCANNER -->

  <button onclick="startScanner()">
    📷 START BARCODE SCANNER
  </button>

  <div id="reader"></div>

  <div id="scanResult" class="box">
    No barcode scanned
  </div>

</div>


<script>

// =====================================
// APPS SCRIPT API URL
// =====================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbxwSEHv6JQGZAxxfvuEPKUHUEZwqXpWgSYr4QCcHzObvuQ3tPgcTkRQofplozrCXacL/exec";


// =====================================
// TEST API CONNECTION
// =====================================

async function testAPI() {

  const result =
    document.getElementById("apiResult");

  result.innerText = "Testing connection...";

  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify({
        action: "TEST"
      })

    });


    const data = await response.json();


    if (data.success) {

      result.innerText =
        "✅ " + data.message;

    } else {

      result.innerText =
        "❌ " + data.message;

    }

  }

  catch(error) {

    result.innerText =
      "❌ CONNECTION ERROR: " + error.message;

  }

}



// =====================================
// BARCODE SCANNER
// =====================================

let scanner = null;
let scanning = false;


async function startScanner() {

  if (scanning) {
    return;
  }

  scanning = true;

  document.getElementById("scanResult").innerText =
    "Starting camera...";


  scanner = new Html5Qrcode("reader");


  try {

    await scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 280,
          height: 120
        },

        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128
        ]
      },

      barcodeDetected,

      function(errorMessage) {
        // Normal scanning errors ignored
      }

    );


    document.getElementById("scanResult").innerText =
      "Camera ready - scan barcode";


  }

  catch(error) {

    scanning = false;

    document.getElementById("scanResult").innerText =
      "❌ Camera Error: " + error;

  }

}



// =====================================
// BARCODE DETECTED
// =====================================

async function barcodeDetected(decodedText) {

  if (!scanning) {
    return;
  }


  scanning = false;


  document.getElementById("scanResult").innerHTML =
    "✅ BARCODE DETECTED<br><br>" +
    decodedText;


  try {

    await scanner.stop();

  }

  catch(error) {

    console.log(error);

  }

}

</script>

</body>

</html>
