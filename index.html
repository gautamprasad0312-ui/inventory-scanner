<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inventory Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
      background: #f4f6f8;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    h1 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      margin-top: 15px;
      cursor: pointer;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
      background: #eeeeee;
      border-radius: 8px;
    }
  </style>
</head>


<body>

<div class="container">

  <h1>Inventory Scanner</h1>

  <p>Scan your product barcode</p>

  <button onclick="startScanner()">
    📷 Start Barcode Scanner
  </button>

  <div id="reader"></div>

  <div id="result">
    No barcode scanned
  </div>

</div>


<script>

let scanner = null;
let scanning = false;


async function startScanner() {

  if (scanning) {
    return;
  }

  scanning = true;

  document.getElementById("result").innerText =
    "Starting camera...";


  scanner = new Html5Qrcode("reader");


  try {

    await scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 280,
          height: 120
        },

        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128
        ]
      },

      barcodeDetected,

      function(errorMessage) {
        // Ignore normal scanning errors
      }

    );


    document.getElementById("result").innerText =
      "Camera ready - scan barcode";


  } catch(error) {

    scanning = false;

    document.getElementById("result").innerText =
      "Camera Error: " + error;

  }

}



async function barcodeDetected(decodedText) {

  // Prevent repeated detection
  if (!scanning) {
    return;
  }

  scanning = false;


  document.getElementById("result").innerHTML =
    "✅ BARCODE DETECTED<br><br>" +
    decodedText;


  // Stop camera after successful scan

  try {

    await scanner.stop();

  } catch(error) {

    console.log(error);

  }

}

</script>

</body>

</html>
